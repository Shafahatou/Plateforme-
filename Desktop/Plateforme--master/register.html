<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - LaVie</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center my-5">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-lg">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <h2 class="text-primary">
                                <i class="fas fa-handshake"></i> LaVie
                            </h2>
                            <p class="text-muted">Créez votre compte</p>
                        </div>
                        
                        <form id="register-form" onsubmit="return validateForm('#register-form')">
                            <div class="mb-3">
                                <label class="form-label">Type de compte</label>
                                <div class="d-flex gap-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="account-type" id="worker" value="worker" required>
                                        <label class="form-check-label" for="worker">
                                            Travailleur
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="account-type" id="employer" value="employer" required>
                                        <label class="form-check-label" for="employer">
                                            Employeur
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="firstname" class="form-label">Prénom</label>
                                    <input type="text" class="form-control" id="firstname" name="firstname" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="lastname" class="form-label">Nom</label>
                                    <input type="text" class="form-control" id="lastname" name="lastname" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fas fa-envelope"></i>
                                    </span>
                                    <input type="email" class="form-control" id="email" name="email" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="phone" class="form-label">Téléphone</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fas fa-phone"></i>
                                    </span>
                                    <input type="tel" class="form-control" id="phone" name="phone" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="address" class="form-label">Adresse</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fas fa-map-marker-alt"></i>
                                    </span>
                                    <input type="text" class="form-control" id="address" name="address" required>
                                    <button class="btn btn-outline-secondary" type="button" id="get-location">
                                        <i class="fas fa-crosshairs"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="worker-fields" style="display: none;">
                                <div class="mb-3">
                                    <label for="skills" class="form-label">Compétences</label>
                                    <select class="form-select" id="skills" name="skills" multiple>
                                        <option value="plomberie">Plomberie</option>
                                        <option value="electricite">Électricité</option>
                                        <option value="menuiserie">Menuiserie</option>
                                        <option value="peinture">Peinture</option>
                                        <option value="jardinage">Jardinage</option>
                                        <option value="menage">Ménage</option>
                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label for="experience" class="form-label">Expérience</label>
                                    <textarea class="form-control" id="experience" name="experience" rows="3"></textarea>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Mot de passe</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fas fa-lock"></i>
                                    </span>
                                    <input type="password" class="form-control" id="password" name="password" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="confirm-password" class="form-label">Confirmer le mot de passe</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fas fa-lock"></i>
                                    </span>
                                    <input type="password" class="form-control" id="confirm-password" name="confirm-password" required>
                                </div>
                            </div>

                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="terms" required>
                                <label class="form-check-label" for="terms">
                                    J'accepte les <a href="/terms">conditions d'utilisation</a>
                                </label>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-user-plus"></i> S'inscrire
                                </button>
                            </div>
                        </form>

                        <div class="text-center mt-4">
                            <p>Déjà inscrit? <a href="/login">Connectez-vous</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="static/js/main.js"></script>
    <script>
        // Toggle worker-specific fields based on account type selection
        document.querySelectorAll('input[name="account-type"]').forEach(radio => {
            radio.addEventListener('change', function() {
                const workerFields = document.querySelector('.worker-fields');
                if (this.value === 'worker') {
                    workerFields.style.display = 'block';
                } else {
                    workerFields.style.display = 'none';
                }
            });
        });

        // Password confirmation validation
        document.getElementById('register-form').addEventListener('submit', function(e) {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (password !== confirmPassword) {
                e.preventDefault();
                alert('Les mots de passe ne correspondent pas!');
            }
        });
    </script>
</body>
</html>
