<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-handshake"></i> LaVie
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="search.html"><i class="fas fa-search"></i> Rechercher</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="services.html"><i class="fas fa-tools"></i> Services</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="historique.html"><i class="fas fa-history"></i> Historique</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="login.html"><i class="fas fa-sign-in-alt"></i> Connexion</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="register.html"><i class="fas fa-user-plus"></i> Inscription</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Header -->
    <header class="bg-primary text-white text-center py-4">
        <div class="container">
            <h1 class="display-5">Demande de remboursement</h1>
            <p class="lead">Remplissez ce formulaire pour demander un remboursement</p>
        </div>
    </header>

    <!-- Remboursement Section -->
    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <form action="process_refund.php" method="POST">
                        <div class="mb-3">
                            <label for="transactionID" class="form-label">ID de la transaction</label>
                            <input type="text" class="form-control" id="transactionID" name="transaction_id" required>
                        </div>

                        <div class="mb-3">
                            <label for="reason" class="form-label">Raison du remboursement</label>
                            <select class="form-control" id="reason" name="refund_reason" required>
                                <option value="service_non_fournit">Service non fourni</option>
                                <option value="erreur_paiement">Erreur de paiement</option>
                                <option value="autre">Autre</option>
                            </select>
                        </div>

                        <div class="mb-3" id="otherReasonSection" style="display: none;">
                            <label for="otherReason" class="form-label">Précisez votre raison</label>
                            <textarea class="form-control" id="otherReason" name="other_reason"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="refundMethod" class="form-label">Méthode de remboursement</label>
                            <select class="form-control" id="refundMethod" name="refund_method" required>
                                <option value="mobile_money">Mobile Money</option>
                                <option value="carte_bancaire">Carte Bancaire</option>
                                <option value="wallet">Portefeuille LaVie</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="refundDetails" class="form-label">Détails pour le remboursement</label>
                            <input type="text" class="form-control" id="refundDetails" name="refund_details" required placeholder="Numéro de compte, téléphone Mobile Money, etc.">
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mt-3">Envoyer la demande</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-light py-4">
        <div class="container text-center">
            <p class="mb-0">&copy; 2024 LaVie. Tous droits réservés.</p>
        </div>
    </footer>

    <script>
        document.getElementById("reason").addEventListener("change", function() {
            var reason = this.value;
            document.getElementById("otherReasonSection").style.display = reason === "autre" ? "block" : "none";
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
